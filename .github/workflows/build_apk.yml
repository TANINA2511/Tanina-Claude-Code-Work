name: Build Android APK

on:
  push:
    branches:
      - claude/sweet-dijkstra-oVWR8
    paths:
      - 'jamaica_audio_tours/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jamaica_audio_tours
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jamaica-audio-tours-apk
          path: jamaica_audio_tours/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
